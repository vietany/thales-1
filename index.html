<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mô Phỏng Định Lý Thales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .canvas-wrap {
      touch-action: none;
      user-select: none;
      cursor: ns-resize;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="card">
      <div class="header-box">
        <h2 class="title thales-title">Định Lý Thales</h2>
        <span class="badge thales-badge">MN // BC</span>
      </div>

      <div class="canvas-wrap" id="wrapThales">
        <svg id="svgThales" viewBox="0 0 460 340">
          <defs>
            <pattern id="gridT" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="460" height="340" fill="url(#gridT)"/>

          <polygon id="polyABC" fill="rgba(37, 99, 235, 0.08)" stroke="#3b82f6" stroke-width="2.5"/>
          <line id="lineMN" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

          <circle id="ptA" r="5" fill="#60a5fa"/>
          <circle id="ptB" r="5" fill="#60a5fa"/>
          <circle id="ptC" r="5" fill="#60a5fa"/>
          <circle id="ptM" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
          <circle id="ptN" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>

          <text id="lblA" class="v-label" fill="#93c5fd">A</text>
          <text id="lblB" class="v-label" fill="#93c5fd">B</text>
          <text id="lblC" class="v-label" fill="#93c5fd">C</text>
          <text id="lblM" class="v-label" fill="#fcd34d">M</text>
          <text id="lblN" class="v-label" fill="#fcd34d">N</text>

          <g id="grpAM">
            <rect id="bgAM" class="dim-bg" stroke="#60a5fa"/>
            <text id="txtAM" class="dim-text" fill="#93c5fd"></text>
          </g>
          <g id="grpMB">
            <rect id="bgMB" class="dim-bg" stroke="#60a5fa"/>
            <text id="txtMB" class="dim-text" fill="#93c5fd"></text>
          </g>
          <g id="grpAN">
            <rect id="bgAN" class="dim-bg" stroke="#60a5fa"/>
            <text id="txtAN" class="dim-text" fill="#93c5fd"></text>
          </g>
          <g id="grpNC">
            <rect id="bgNC" class="dim-bg" stroke="#60a5fa"/>
            <text id="txtNC" class="dim-text" fill="#93c5fd"></text>
          </g>
        </svg>
      </div>

      <div class="controls">
        <div class="slider-row">
          <input id="sliderMN" class="thales-slider" type="range" min="0" max="1" step="0.005" value="0.5">
        </div>
      </div>

      <div class="math-panel">
        <div class="formula-row">
          <div class="side-tag side-thales">
            <span class="frac-block">
              <span class="num">AM</span>
              <span class="den">AB</span>
            </span>
            &nbsp;=&nbsp;
            <span class="frac-block">
              <span id="numAM" class="num">0.0</span>
              <span id="denAB" class="den">0.0</span>
            </span>
            &nbsp;=&nbsp;
            <span id="valRatioL" class="math-font">0.00</span>
          </div>

          <span class="math-eq">=</span>

          <div class="side-tag side-thales">
            <span class="frac-block">
              <span class="num">AN</span>
              <span class="den">AC</span>
            </span>
            &nbsp;=&nbsp;
            <span class="frac-block">
              <span id="numAN" class="num">0.0</span>
              <span id="denAC" class="den">0.0</span>
            </span>
            &nbsp;=&nbsp;
            <span id="valRatioR" class="math-font">0.00</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="header-box">
        <h2 class="title non-title">Không Song Song</h2>
        <span class="badge non-badge">PQ ∦ EF</span>
      </div>

      <div class="canvas-wrap" id="wrapNon">
        <svg id="svgNon" viewBox="0 0 460 340">
          <defs>
            <pattern id="gridN" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="460" height="340" fill="url(#gridN)"/>

          <polygon id="polyDEF" fill="rgba(225, 29, 72, 0.08)" stroke="#f43f5e" stroke-width="2.5"/>
          <line id="linePQ" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>

          <circle id="ptD" r="5" fill="#f43f5e"/>
          <circle id="ptE" r="5" fill="#f43f5e"/>
          <circle id="ptF" r="5" fill="#f43f5e"/>
          <circle id="ptP" r="6" fill="#fb7185" stroke="#ffffff" stroke-width="1.5"/>
          <circle id="ptQ" r="6" fill="#fb7185" stroke="#ffffff" stroke-width="1.5"/>

          <text id="lblD" class="v-label" fill="#fda4af">D</text>
          <text id="lblE" class="v-label" fill="#fda4af">E</text>
          <text id="lblF" class="v-label" fill="#fda4af">F</text>
          <text id="lblP" class="v-label" fill="#fecdd3">P</text>
          <text id="lblQ" class="v-label" fill="#fecdd3">Q</text>

          <g id="grpDP">
            <rect id="bgDP" class="dim-bg" stroke="#f43f5e"/>
            <text id="txtDP" class="dim-text" fill="#fda4af"></text>
          </g>
          <g id="grpPE">
            <rect id="bgPE" class="dim-bg" stroke="#f43f5e"/>
            <text id="txtPE" class="dim-text" fill="#fda4af"></text>
          </g>
          <g id="grpDQ">
            <rect id="bgDQ" class="dim-bg" stroke="#f43f5e"/>
            <text id="txtDQ" class="dim-text" fill="#fda4af"></text>
          </g>
          <g id="grpQF">
            <rect id="bgQF" class="dim-bg" stroke="#f43f5e"/>
            <text id="txtQF" class="dim-text" fill="#fda4af"></text>
          </g>
        </svg>
      </div>

      <div class="controls">
        <div class="slider-row">
          <input id="sliderPQ" class="non-slider" type="range" min="0.08" max="0.92" step="0.005" value="0.45">
        </div>
      </div>

      <div class="math-panel">
        <div class="formula-row">
          <div class="side-tag side-non">
            <span class="frac-block">
              <span class="num">DP</span>
              <span class="den">DE</span>
            </span>
            &nbsp;=&nbsp;
            <span class="frac-block">
              <span id="numDP" class="num">0.0</span>
              <span id="denDE" class="den">0.0</span>
            </span>
            &nbsp;=&nbsp;
            <span id="valRatioDP" class="math-font">0.00</span>
          </div>

          <span class="math-neq">≠</span>

          <div class="side-tag side-non">
            <span class="frac-block">
              <span class="num">DQ</span>
              <span class="den">DF</span>
            </span>
            &nbsp;=&nbsp;
            <span class="frac-block">
              <span id="numDQ" class="num">0.0</span>
              <span id="denDF" class="den">0.0</span>
            </span>
            &nbsp;=&nbsp;
            <span id="valRatioDQ" class="math-font">0.00</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const A = { x: 190, y: 55 };
    const B = { x: 70, y: 300 };
    const C = { x: 395, y: 275 };

    const D = { x: 175, y: 55 };
    const E = { x: 65, y: 305 };
    const F = { x: 405, y: 270 };

    const efAngle = Math.atan2(F.y - E.y, F.x - E.x);
    const fixedAnglePQ = efAngle - (18 * Math.PI / 180);
    const dirPQ = { x: Math.cos(fixedAnglePQ), y: Math.sin(fixedAnglePQ) };

    function dist(p1, p2) {
      return Math.sqrt((p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2);
    }

    function lerp(p1, p2, t) {
      return {
        x: p1.x + (p2.x - p1.x) * t,
        y: p1.y + (p2.y - p1.y) * t
      };
    }

    function intersectRaySegment(p, v, s1, s2) {
      const dx = s2.x - s1.x;
      const dy = s2.y - s1.y;
      const denom = v.x * dy - v.y * dx;
      if (Math.abs(denom) < 1e-9) return null;
      const t = ((s1.x - p.x) * dy - (s1.y - p.y) * dx) / denom;
      const u = ((s1.x - p.x) * v.y - (s1.y - p.y) * v.x) / denom;
      return { t, u, pt: { x: p.x + t * v.x, y: p.y + t * v.y } };
    }

    function setTag(txtId, bgId, textVal, p1, p2, ox, oy) {
      const txt = document.getElementById(txtId);
      const bg = document.getElementById(bgId);
      txt.textContent = textVal;
      const mx = (p1.x + p2.x) / 2 + ox;
      const my = (p1.y + p2.y) / 2 + oy;
      txt.setAttribute('x', mx);
      txt.setAttribute('y', my);
      const b = txt.getBBox();
      bg.setAttribute('x', b.x - 4);
      bg.setAttribute('y', b.y - 2);
      bg.setAttribute('width', b.width + 8);
      bg.setAttribute('height', b.height + 4);
    }

    function updateThales() {
      const k = parseFloat(document.getElementById('sliderMN').value);
      const M = lerp(A, B, k);
      const N = lerp(A, C, k);

      document.getElementById('polyABC').setAttribute('points', `${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`);

      const lineMN = document.getElementById('lineMN');
      lineMN.setAttribute('x1', M.x);
      lineMN.setAttribute('y1', M.y);
      lineMN.setAttribute('x2', N.x);
      lineMN.setAttribute('y2', N.y);

      function setPt(id, p) {
        const el = document.getElementById(id);
        el.setAttribute('cx', p.x);
        el.setAttribute('cy', p.y);
      }
      setPt('ptA', A);
      setPt('ptB', B);
      setPt('ptC', C);
      setPt('ptM', M);
      setPt('ptN', N);

      function setPos(id, p, dx, dy) {
        const el = document.getElementById(id);
        el.setAttribute('x', p.x + dx);
        el.setAttribute('y', p.y + dy);
      }
      setPos('lblA', A, -4, -14);
      setPos('lblB', B, -16, 14);
      setPos('lblC', C, 14, 12);
      setPos('lblM', M, -18, -4);
      setPos('lblN', N, 16, -4);

      const dAM = (dist(A, M) / 25).toFixed(1);
      const dMB = (dist(M, B) / 25).toFixed(1);
      const dAN = (dist(A, N) / 25).toFixed(1);
      const dNC = (dist(N, C) / 25).toFixed(1);
      const dAB = (dist(A, B) / 25).toFixed(1);
      const dAC = (dist(A, C) / 25).toFixed(1);

      setTag('txtAM', 'bgAM', dAM, A, M, -18, 0);
      setTag('txtMB', 'bgMB', dMB, M, B, -18, 0);
      setTag('txtAN', 'bgAN', dAN, A, N, 18, 0);
      setTag('txtNC', 'bgNC', dNC, N, C, 18, 0);

      const rL = (parseFloat(dAB) === 0) ? "0.00" : (parseFloat(dAM) / parseFloat(dAB)).toFixed(2);
      const rR = (parseFloat(dAC) === 0) ? "0.00" : (parseFloat(dAN) / parseFloat(dAC)).toFixed(2);

      document.getElementById('numAM').textContent = dAM;
      document.getElementById('denAB').textContent = dAB;
      document.getElementById('valRatioL').textContent = rL;

      document.getElementById('numAN').textContent = dAN;
      document.getElementById('denAC').textContent = dAC;
      document.getElementById('valRatioR').textContent = rR;
    }

    function updateNon() {
      const kP = parseFloat(document.getElementById('sliderPQ').value);
      const P = lerp(D, E, kP);
      const res = intersectRaySegment(P, dirPQ, D, F);

      let Q;
      if (res && res.u >= 0 && res.u <= 1) {
        Q = res.pt;
      } else {
        Q = lerp(D, F, Math.min(1, Math.max(0, kP * 0.75 + 0.1)));
      }

      document.getElementById('polyDEF').setAttribute('points', `${D.x},${D.y} ${E.x},${E.y} ${F.x},${F.y}`);

      const linePQ = document.getElementById('linePQ');
      linePQ.setAttribute('x1', P.x);
      linePQ.setAttribute('y1', P.y);
      linePQ.setAttribute('x2', Q.x);
      linePQ.setAttribute('y2', Q.y);

      function setPt(id, p) {
        const el = document.getElementById(id);
        el.setAttribute('cx', p.x);
        el.setAttribute('cy', p.y);
      }
      setPt('ptD', D);
      setPt('ptE', E);
      setPt('ptF', F);
      setPt('ptP', P);
      setPt('ptQ', Q);

      function setPos(id, p, dx, dy) {
        const el = document.getElementById(id);
        el.setAttribute('x', p.x + dx);
        el.setAttribute('y', p.y + dy);
      }
      setPos('lblD', D, -4, -14);
      setPos('lblE', E, -16, 14);
      setPos('lblF', F, 14, 12);
      setPos('lblP', P, -18, -4);
      setPos('lblQ', Q, 16, -4);

      const dDP = (dist(D, P) / 25).toFixed(1);
      const dPE = (dist(P, E) / 25).toFixed(1);
      const dDQ = (dist(D, Q) / 25).toFixed(1);
      const dQF = (dist(Q, F) / 25).toFixed(1);
      const dDE = (dist(D, E) / 25).toFixed(1);
      const dDF = (dist(D, F) / 25).toFixed(1);

      setTag('txtDP', 'bgDP', dDP, D, P, -18, 0);
      setTag('txtPE', 'bgPE', dPE, P, E, -18, 0);
      setTag('txtDQ', 'bgDQ', dDQ, D, Q, 18, 0);
      setTag('txtQF', 'bgQF', dQF, Q, F, 18, 0);

      const rP = (parseFloat(dDP) / parseFloat(dDE)).toFixed(2);
      const rQ = (parseFloat(dDQ) / parseFloat(dDF)).toFixed(2);

      document.getElementById('numDP').textContent = dDP;
      document.getElementById('denDE').textContent = dDE;
      document.getElementById('valRatioDP').textContent = rP;

      document.getElementById('numDQ').textContent = dDQ;
      document.getElementById('denDF').textContent = dDF;
      document.getElementById('valRatioDQ').textContent = rQ;
    }

    function setupPanelDrag(wrapId, svgId, sliderId, topY, bottomY, callback) {
      const wrap = document.getElementById(wrapId);
      const svg = document.getElementById(svgId);
      const slider = document.getElementById(sliderId);
      let isDragging = false;

      function getSvgY(e) {
        const pt = svg.createSVGPoint();
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        pt.x = 0;
        pt.y = clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse()).y;
      }

      function applyDrag(e) {
        const curY = getSvgY(e);
        let ratio = (curY - topY) / (bottomY - topY);
        const minVal = parseFloat(slider.min);
        const maxVal = parseFloat(slider.max);
        ratio = Math.max(minVal, Math.min(maxVal, ratio));
        slider.value = ratio;
        callback();
      }

      function handleStart(e) {
        isDragging = true;
        applyDrag(e);
        if (e.cancelable) e.preventDefault();
      }

      function handleMove(e) {
        if (!isDragging) return;
        applyDrag(e);
        if (e.cancelable) e.preventDefault();
      }

      function handleEnd() {
        isDragging = false;
      }

      wrap.addEventListener('mousedown', handleStart);
      wrap.addEventListener('touchstart', handleStart, { passive: false });

      window.addEventListener('mousemove', handleMove);
      window.addEventListener('touchmove', handleMove, { passive: false });

      window.addEventListener('mouseup', handleEnd);
      window.addEventListener('touchend', handleEnd);
    }

    document.getElementById('sliderMN').addEventListener('input', updateThales);
    document.getElementById('sliderPQ').addEventListener('input', updateNon);

    setupPanelDrag('wrapThales', 'svgThales', 'sliderMN', A.y, (B.y + C.y) / 2, updateThales);
    setupPanelDrag('wrapNon', 'svgNon', 'sliderPQ', D.y, (E.y + F.y) / 2, updateNon);

    window.addEventListener('DOMContentLoaded', () => {
      updateThales();
      updateNon();
    });
  </script>
</body>
</html>
